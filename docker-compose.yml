# Optional local Postgres. Not required if you point DATABASE_URL at Neon.
# The grader is expected to use this; see README.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: velozity
      POSTGRES_PASSWORD: velozity
      POSTGRES_DB: velozity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velozity"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
